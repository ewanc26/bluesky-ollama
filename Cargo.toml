[package]
name = "bluesky-ollama"
authors = ["Ewan Croft (ewanc26)"]
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2021"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
reqwest = { version = "0.12.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.86"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-appender = "0.2.3"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
bsky-sdk = "0.2.0"
atrium-api = "0.26.0"
ollama-rs = "0.3.4"
chrono = "0.4.38"
regex = "1.13.1"
html-escape = "0.2.13"
rand = "0.8.5"
